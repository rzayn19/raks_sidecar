apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
  namespace: rahul-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-app
  template:
    metadata:
      labels:
        app: springboot-app
    spec:
      volumes:
      - name: logs-volume
        persistentVolumeClaim:
          claimName: logs-pvc

      containers:
      - name: springboot-app
        image: runity77/sidecar:v1
        ports:
        - containerPort: 8081  # Fixed: Updated port 8080 -> 8081 to match your application.properties
        volumeMounts:
        - name: logs-volume
          mountPath: /logs

      - name: sidecar
        image: busybox
        command:
        - sh
        - -c
        - |
          # Wait until Spring Boot creates the log file, then tail it
          until [ -f /logs/springboot.log ]; do sleep 1; done
          tail -n +1 -f /logs/springboot.log
        volumeMounts:
        - name: logs-volume
          mountPath: /logs
